name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate Android project
        run: |
          P=proj/app/src/main
          mkdir -p $P/java/com/sardor/kalkulyator $P/assets $P/res/drawable
          cp index.html $P/assets/index.html
          cat > proj/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Kalkulyator"
          include ":app"
          EOF
          cat > proj/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          echo "android.useAndroidX=true" > proj/gradle.properties
          cat > proj/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.sardor.kalkulyator'
            compileSdk 34
            defaultConfig {
              applicationId 'com.sardor.kalkulyator'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
          EOF
          cat > $P/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Kalkulyator" android:icon="@drawable/ic" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > $P/res/drawable/ic.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#000000" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FF9F0A" android:pathData="M54,54m-30,0a30,30 0 1,1 60,0a30,30 0 1,1 -60,0"/>
            <path android:fillColor="#FFFFFF" android:pathData="M40,52h28v4h-28z"/>
          </vector>
          EOF
          cat > $P/java/com/sardor/kalkulyator/MainActivity.java <<'EOF'
          package com.sardor.kalkulyator;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.*;
          import androidx.webkit.WebViewAssetLoader;
          public class MainActivity extends Activity {
            WebView w;
            ValueCallback<Uri[]> cb;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);
              getWindow().setStatusBarColor(Color.BLACK);
              getWindow().setNavigationBarColor(Color.BLACK);
              w = new WebView(this);
              w.setBackgroundColor(Color.BLACK);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              final WebViewAssetLoader L = new WebViewAssetLoader.Builder()
                .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
              w.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  return L.shouldInterceptRequest(r.getUrl());
                }
              });
              w.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> c, FileChooserParams p) {
                  if (cb != null) cb.onReceiveValue(null);
                  cb = c;
                  try { startActivityForResult(p.createIntent(), 1); }
                  catch (Exception e) { cb = null; return false; }
                  return true;
                }
              });
              w.loadUrl("https://appassets.androidplatform.net/assets/index.html");
            }
            @Override protected void onActivityResult(int r, int c, Intent d) {
              if (r == 1 && cb != null) {
                cb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(c, d));
                cb = null;
              }
            }
            @Override public void onBackPressed() { moveTaskToBack(true); }
          }
          EOF
      - name: Build
        run: cd proj && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Kalkulyator-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
